add:
  fields:
    name:
      example: "Lurpak Spreadable 400g"
      selector:
        text:
    barcode:
      example: "5740900403245"
      selector:
        text:
    storage:
      example: "Fridge"
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          mode: box
    expires:
      example: "2026-12-04"
      selector:
        date:
consume:
  fields:
    name:
      required: true
      example: "Lurpak Spreadable 400g"
      selector:
        text:
    storage:
      example: "Fridge"
      selector:
        text:
    quantity:
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          mode: box
    thrown_away:
      default: false
      selector:
        boolean:
add_to_shopping_list:
  fields:
    name:
      required: true
      example: "Milk"
      selector:
        text:
    list:
      example: "Shopping"
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          mode: box
